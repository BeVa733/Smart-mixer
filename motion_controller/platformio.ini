[platformio]
default_envs = uno_r4_minima

[env:uno_r4_minima]
platform = renesas-ra @ 1.9.0
board = uno_r4_minima
framework = arduino
build_src_filter = -<*> +<main.cpp>
upload_protocol = dfu
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
monitor_speed = 115200
monitor_eol = LF
monitor_filters = send_on_enter

[env:desktop_usb]
extends = env:uno_r4_minima
build_flags = -DSMART_MIXER_MANUAL_HOME
lib_deps =
    symlink://../shared/SmartMixerControl

[env:uart_diagnostics]
extends = env:uno_r4_minima
build_src_filter = -<*> +<uart_diagnostics.cpp>
lib_deps =
    symlink://../shared/SmartMixerProtocol
